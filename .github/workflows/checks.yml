name: Pipeline checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r nfl-team-index/requirements.txt
      - run: python -m unittest discover -s nfl-team-index -p 'test_*.py'
